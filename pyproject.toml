[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"


[project]
name = "rustpy-xlsxwriter"
description = "High-performance Excel and CSV file generation powered by Rust (~7-9x faster)"
readme = "README.md"
license = { text = "MIT" }
keywords = ["excel", "xlsx", "csv", "rust", "xlsxwriter", "performance", "polars", "pandas", "arrow"]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dynamic = ["version"]
authors = [{ name = "Rahmad Afandi", email = "rahmadafandiii@gmail.com" }]

[project.urls]
Homepage = "https://github.com/rahmadafandi/rustpy-xlsxwriter"
Repository = "https://github.com/rahmadafandi/rustpy-xlsxwriter"
Issues = "https://github.com/rahmadafandi/rustpy-xlsxwriter/issues"

[project.optional-dependencies]
# Everything the test suite imports, including the optional DataFrame backends
# the Arrow path is exercised against.
tests = [
    "pytest",
    "pytest-codspeed",
    "XlsxWriter",
    "faker",
    "openpyxl",
    "pandas",
    "polars",
    "pyarrow",
    "numpy",
]
# Tests plus the build and formatting tools the Makefile drives.
dev = [
    "rustpy-xlsxwriter[tests]",
    "maturin>=1.8,<2.0",
    "autoflake",
    "black",
    "isort",
    "pyclean",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
markers = [
    "benchmark: performance benchmarks, deselected by default in CI",
    "recalc: opens output in LibreOffice to verify computed formula results",
]
