name: Docs

on:
  push:
    branches: [master]
    paths:
      - "rustpy_xlsxwriter/**"
      - "src/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # `pip install .` builds the extension through the maturin backend so
      # mkdocstrings can resolve the package; griffe then reads the prose from
      # `rustpy_xlsxwriter.pyi`, which is where it lives — the compiled
      # functions carry no `__doc__` of their own.
      - name: Build & install package + docs toolchain
        run: pip install . mkdocs-material "mkdocstrings[python]"

      - name: Build site
        run: mkdocs build --strict -d site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
