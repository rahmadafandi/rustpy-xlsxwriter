name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-latest
            target: x86
            python_arch: x86
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.13
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  freethreaded:
    # The jobs above use --find-interpreter, which only sees the interpreters
    # installed on the runner. A free-threaded build is a separate binary
    # (python3.14t), so it is never picked up and no cp314t wheel is produced —
    # even though the package advertises Python 3.14 support.
    #
    # Scoped to the platforms free-threading is actually run on. The exotic
    # linux targets (s390x, ppc64le, armv7, x86) have no free-threaded
    # interpreter available, and cross-building one is not worth it until
    # somebody asks.
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      # One platform lacking a 3.14t interpreter must not hide the others.
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
          - runner: macos-latest
            target: aarch64
          - runner: macos-15-intel
            target: x86_64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.14t
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # Name the interpreter explicitly — discovery is what misses it.
          args: --release --out dist -i python3.14t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-freethreaded-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  test:
    # Every other job only proves the extension compiles. This one is the only
    # place the 400+ tests and clippy actually run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install
        # Builds the extension through the maturin backend and pulls the
        # DataFrame backends the Arrow paths are exercised against.
        run: pip install -e ".[tests]"
      - name: Test
        run: pytest tests/ -m "not benchmark" -ra
      - name: Clippy
        # 3.5k lines of FFI and parsing that CodeQL's Python analysis cannot see.
        run: cargo clippy --all-targets -- -D warnings
      - name: Rustfmt
        run: cargo fmt --check
      - name: Examples
        # 16 scripts and a notebook ship in the repo; nothing ran them, so
        # nothing would have noticed them rotting against an API change.
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            python "$f" >/dev/null
          done

  msrv:
    # rust-version in Cargo.toml is a promise; this is what keeps it one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: cargo check --all-targets

  coverage:
    # Measures the Rust, which is the library — pytest-cov would only see the
    # ~130 statements of the Python wrapper and report a number that flatters.
    # The extension is built with coverage instrumentation and then exercised
    # by the ordinary Python suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install
        run: pip install -e ".[tests]"
        env:
          RUSTFLAGS: "-Cinstrument-coverage"
          LLVM_PROFILE_FILE: "${{ github.workspace }}/prof/%p-%m.profraw"
      - name: Run the suite under instrumentation
        run: pytest tests/ -m "not benchmark" -q
        env:
          LLVM_PROFILE_FILE: "${{ github.workspace }}/prof/%p-%m.profraw"
      - name: Report
        run: |
          LLVM=$(dirname "$(find "$(rustc --print sysroot)" -name llvm-profdata | head -1)")
          "$LLVM/llvm-profdata" merge -sparse prof/*.profraw -o cov.profdata
          SO=$(ls rustpy_xlsxwriter/*.so)
          IGNORE='(cargo/registry|rustc|/rustlib/)'
          "$LLVM/llvm-cov" report "$SO" -instr-profile=cov.profdata \
            -ignore-filename-regex="$IGNORE"
          "$LLVM/llvm-cov" export "$SO" -instr-profile=cov.profdata \
            -ignore-filename-regex="$IGNORE" --format=lcov > lcov.info
      - name: Upload to Codecov
        # Inert until a token is set, so the job is useful either way: the
        # table above is printed in the log regardless. The condition reads
        # `env` rather than `secrets` — the secrets context is not available
        # to `if`.
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [test, msrv, coverage, linux, musllinux, windows, macos, freethreaded, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
